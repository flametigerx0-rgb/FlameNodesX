
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlameNodesX | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🔥 FlameNodesX</h1>
    <p>FREE MINECRAFT HOSTING</p>
  </header>

  <main>
    <section class="panel">
      <h2>Create Account</h2>
      <form id="signupForm">
        <p><input id="signupUser" type="text" placeholder="Username" required></p>
        <p><input id="signupEmail" type="email" placeholder="Email" required></p>
        <p><input id="signupPass" type="password" placeholder="Password" required></p>
        <button type="submit">Sign Up</button>
      </form>
    </section>

    <section class="panel">
      <h2>Login</h2>
      <form id="loginForm">
        <p><input id="loginEmail" type="email" placeholder="Email" required></p>
        <p><input id="loginPass" type="password" placeholder="Password" required></p>
        <button type="submit">Login</button>
      </form>
      <p id="message">Welcome to FlameNodesX!</p>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
