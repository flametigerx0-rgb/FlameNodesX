
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlameNodesX Hosting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🔥 FlameNodesX</h1>
    <p>FREE MINECRAFT SERVER HOSTING</p>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome to FlameNodesX</h2>
      <p>Create and manage your own Minecraft SMP.</p>
    </section>

    <section class="panel">
      <h2>Your Server</h2>
      <div id="status">Status: Not Created</div>
      <p>RAM: 4 GB target</p>
      <p>Auto shutdown: 20 minutes when empty</p>
      <button id="create">Create SMP</button>
      <button id="start">Start</button>
      <button id="stop">Stop</button>
    </section>

    <section class="panel">
      <h2>Server Console</h2>
      <pre id="console">Welcome to FlameNodesX!</pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
